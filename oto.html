<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>音えらび</title>
<style>
:root{--bg:#0a0b0d;--panel:#14161a;--line:#262a31;--ink:#f2f4f6;--sub:#7d848e;--a:#c8ff2e;--b:#ff4fb8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
.wrap{max-width:440px;margin:0 auto;padding:24px 16px 40px}
h1{font-size:20px;margin:0 0 4px}
p{color:var(--sub);font-size:13px;margin:0 0 18px}
.list{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;color:inherit;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 10px;text-align:left;display:flex;gap:12px;align-items:center}
button:active{border-color:var(--b)}
button b{font-family:"Oswald","Bahnschrift",sans-serif;font-size:26px;color:var(--a);width:28px;text-align:center}
button span{display:block;font-weight:800;font-size:17px}
button small{display:block;color:var(--sub);font-size:11px}
</style>
</head>
<body>
<div class="wrap">
  <h1>音えらび</h1>
  <p>押すと1回鳴ります。気に入った番号を教えてください。（消音スイッチがオンだと鳴らないことがあります）</p>
  <div class="list" id="list"></div>
</div>
<script>
let ac;
function A(){if(!ac){try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}ac=new(window.AudioContext||window.webkitAudioContext)()}if(ac.state==='suspended')ac.resume();return ac}
function tone(f,t,len,vol,type='sine',to,toAt){
  const a=A(),o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(to)o.frequency.exponentialRampToValueAtTime(to,t+(toAt||len*.6));
  o.connect(g);g.connect(a.destination);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.006);g.gain.exponentialRampToValueAtTime(.001,t+len);
  o.start(t);o.stop(t+len+.05);
}
const S=[
  ['ぴん','高くて短い、すっきり',t=>{tone(2637,t,.35,.4);tone(5274,t,.15,.06)}],
  ['ぽこっ','木の玉みたいな丸い音',t=>{tone(1400,t,.16,.55,'sine',2100,.03)}],
  ['ちーん','鈴の余韻がのこる',t=>{tone(3136,t,1.1,.3);tone(6272,t,.5,.07);tone(4699,t,.6,.06)}],
  ['ぷっ','ゲームっぽい小さな音',t=>{tone(1976,t,.12,.3,'square',2637,.04)}],
  ['きゅるん','上にくるっとのぼる',t=>{tone(1300,t,.32,.45,'sine',3500,.2)}],
  ['ころん','木琴みたいにやさしい',t=>{tone(2093,t,.45,.5);tone(8372,t,.05,.08)}],
  ['ぴょこ','おもちゃのはねる音',t=>{tone(2400,t,.14,.35,'triangle',1600,.1)}],
  ['しゃらん','きらっと光る音',t=>{[4186,5274,6272].forEach((f,i)=>tone(f,t+i*.025,.7-i*.1,.14))}],
];
S.forEach(([n,d,fn],i)=>{const b=document.createElement('button');b.innerHTML=`<b>${i+1}</b><div><span>${n}</span><small>${d}</small></div>`;
  b.onclick=()=>fn(A().currentTime+.02);document.getElementById('list').appendChild(b)});
</script>
</body>
</html>
